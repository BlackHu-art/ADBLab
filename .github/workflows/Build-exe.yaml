name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions: write-all

env:
  FIRMWARE_WIN: ADBLab
  VERSION: v2.0.${{ github.run_id }}

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    strategy:
      matrix:
        include:
#          - arch: x86
          - arch: x64

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}

      # 3. 缓存 pip
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. 清理旧构建文件
      - name: Clean environment
        shell: powershell
        run: |
          Write-Host "🧹 Cleaning build environment..."
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

      # 5. 安装依赖
      - name: Install dependencies
        shell: powershell
        run: |
          Write-Host "Installing dependencies..."
          pip install -r requirements.txt

      # 6. 使用 PyInstaller 打包
      - name: Build EXE with PyInstaller
        shell: powershell
        run: |
          # 检查必要文件是否存在
          if (!(Test-Path "main.py")) {
            Write-Error "main.py not found in current directory"
            exit 1
          }
      
          Write-Host "🚀 Building for ${{ matrix.arch }}..."
      
          $data = "--add-data `"resources;resources`" --add-data `"icon.ico;.`" --add-data `"scrcpy-win64-v3.3.1;scrcpy-win64-v3.3.1`""
          if (Test-Path "icon.ico") {
            Write-Host "Using icon.ico"
            $command = "python -m PyInstaller --name ADBLab-${{ matrix.arch }}-${{ env.VERSION }} --onefile --windowed --icon icon.ico $data main.py"
          } else {
            Write-Host "Building without icon"
            $command = "python -m PyInstaller --name ADBLab-${{ matrix.arch }}-${{ env.VERSION }} --onefile --windowed $data main.py"
          }
      
          # 执行构建命令
          Invoke-Expression $command


      # 7. 上传构建产物
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADBLab-${{ matrix.arch }}-exe
          path: |
            dist/*.exe
          if-no-files-found: error

  # Release Job
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 下载所有 artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      # 创建 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          draft: false
          prerelease: false
          files: release_artifacts/**/*

