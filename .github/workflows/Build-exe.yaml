name: Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          from utils.app_metadata import APP_RELEASE_TAG
          print(APP_RELEASE_TAG)
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version not already published
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | grep -q .; then
            echo "Tag ${{ steps.version.outputs.version }} already exists; bump utils/app_metadata.py APP_VERSION"
            exit 1
          fi

  build:
    needs: version
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ADBLab-win-x64
            package_mode: --onedir
            windowed: --windowed
            icon: --icon icon.ico
            datas: --add-data "resources;resources" --add-data "icon.ico;." --add-data "scrcpy-win64-v3.3.1;scrcpy-win64-v3.3.1" --add-data "mobileperf;mobileperf"
            pip_cache: ~\AppData\Local\pip\Cache

          - os: macos-latest
            artifact: ADBLab-macos-x64
            package_mode: --onefile
            windowed: --windowed
            icon: ""
            datas: --add-data "resources:resources" --add-data "icon.ico:." --add-data "mobileperf:mobileperf"
            pip_cache: ~/Library/Caches/pip

          - os: ubuntu-latest
            artifact: ADBLab-linux-x64
            package_mode: --onefile
            windowed: ""
            icon: ""
            datas: --add-data "resources:resources" --add-data "icon.ico:." --add-data "mobileperf:mobileperf"
            pip_cache: ~/.cache/pip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ matrix.pip_cache }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Clean
        shell: bash
        run: rm -rf build dist || true

      - name: Install build dependencies
        shell: bash
        run: pip install -r requirements-build.txt

      - name: Install test dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        if: runner.os == 'Windows'
        shell: bash
        run: python -m ruff check .

      - name: Type check with pyright
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pyright

      - name: Run fast tests (not UI)
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pytest -q -m "not ui"

      - name: Run tests
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pytest -q

      - name: Source self-check
        if: runner.os != 'Windows'
        shell: bash
        run: python main.py --self-check packaging

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --name "${{ matrix.artifact }}-${{ needs.version.outputs.version }}" \
            ${{ matrix.package_mode }} ${{ matrix.windowed }} \
            ${{ matrix.icon }} \
            --collect-submodules mobileperf \
            ${{ matrix.datas }} \
            main.py

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          & "dist/$name/$name.exe" --self-check packaging

      - name: Zip Windows onedir artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          Remove-Item -Recurse -Force "dist/$name"

      - name: Zip macOS app artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          if [ -d "dist/$name.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/$name.app" "dist/$name.zip"
            rm -rf "dist/$name.app"
            rm -f "dist/$name"
          elif [ -f "dist/$name" ]; then
            (cd dist && zip -q "$name.zip" "$name")
            rm -f "dist/$name"
          else
            ls -la dist
            exit 1
          fi

      - name: Archive Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          chmod +x "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -f "dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release_artifacts

      - name: Create Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.version }}"
          TITLE="Release $TAG"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published versions are immutable."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; published versions are immutable."
            exit 1
          fi

          mapfile -d '' FILES < <(find release_artifacts -type f -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release artifacts found"
            exit 1
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Automated release $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Retain latest 5 version tags
        shell: bash
        run: |
          set -euo pipefail
          KEEP=5
          mapfile -t TAGS < <(git ls-remote --tags origin "refs/tags/v*" \
            | awk '{print $2}' | sed 's|refs/tags/||' | sort -V)
          if [ "${#TAGS[@]}" -le "$KEEP" ]; then
            echo "Version tags within retention limit (${#TAGS[@]} <= ${KEEP}); nothing to prune."
            exit 0
          fi
          DROP_COUNT=$((${#TAGS[@]} - KEEP))
          echo "Pruning ${DROP_COUNT} oldest version tags; keeping newest ${KEEP}."
          for TAG in "${TAGS[@]:0:${DROP_COUNT}}"; do
            echo "Removing old version tag and its release: $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            git push origin --delete "refs/tags/$TAG" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
