name: Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions: write-all

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          from utils.app_metadata import APP_RELEASE_TAG
          print(APP_RELEASE_TAG)
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ADBLab-win-x64
            onefile: --windowed
            icon: --icon icon.ico
            datas: --add-data "resources;resources" --add-data "icon.ico;." --add-data "scrcpy-win64-v3.3.1;scrcpy-win64-v3.3.1"
            pip_cache: ~\AppData\Local\pip\Cache

          - os: macos-latest
            artifact: ADBLab-macos-x64
            onefile: --windowed
            icon: ""
            datas: --add-data "resources:resources" --add-data "icon.ico:."
            pip_cache: ~/Library/Caches/pip

          - os: ubuntu-latest
            artifact: ADBLab-linux-x64
            onefile: ""
            icon: ""
            datas: --add-data "resources:resources" --add-data "icon.ico:."
            pip_cache: ~/.cache/pip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ${{ matrix.pip_cache }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Clean
        shell: bash
        run: rm -rf build dist || true

      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --name "${{ matrix.artifact }}-${{ needs.version.outputs.version }}" \
            --onefile ${{ matrix.onefile }} \
            ${{ matrix.icon }} \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebChannel \
            ${{ matrix.datas }} \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          path: release_artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: "Release ${{ needs.version.outputs.version }}"
          draft: false
          prerelease: false
          files: release_artifacts/**/*

      - name: Prune old workflow runs (keep 5)
        shell: bash
        run: |
          RUNS=$(gh run list --repo ${{ github.repository }} --workflow ${{ github.workflow }} --limit 100 --json databaseId --jq '.[].databaseId' | tail -n +6)
          for id in $RUNS; do
            echo "Deleting run $id"
            gh run delete "$id" --repo ${{ github.repository }}
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prune old releases (keep 5)
        shell: bash
        run: |
          RELEASES=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | tail -n +6)
          for tag in $RELEASES; do
            echo "Deleting release $tag"
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
          done
        env:
          GH_TOKEN: ${{ github.token }}
