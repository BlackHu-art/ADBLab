name: Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release from main after building
        type: boolean
        default: false
  push:
    branches: ["main"]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read app version and publish mode
        id: version
        shell: bash
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from utils.app_metadata import APP_RELEASE_TAG

          event = os.environ["GITHUB_EVENT_NAME"]
          publish = event == "push" or (
              event == "workflow_dispatch" and os.environ["REQUESTED_PUBLISH"] == "true"
          )
          if publish and os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Publishing is only allowed from main; disable publish to build this ref.")
          if publish:
              notes_path = Path(".github/release-notes") / f"{APP_RELEASE_TAG}.md"
              try:
                  notes = notes_path.read_text(encoding="utf-8")
              except FileNotFoundError:
                  raise SystemExit(f"Release notes are missing: {notes_path}") from None
              except UnicodeError:
                  raise SystemExit(f"Release notes must be UTF-8: {notes_path}") from None
              expected_title = f"# ADBLab {APP_RELEASE_TAG}"
              title, _separator, body = notes.partition("\n")
              if title.rstrip("\r") != expected_title or not body.strip():
                  raise SystemExit(
                      f"Release notes must start with {expected_title!r} and contain a non-empty body: {notes_path}"
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={APP_RELEASE_TAG}\n")
              output.write(f"publish={str(publish).lower()}\n")
          PY

      - name: Verify version not already published
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.version }}" | grep -q .; then
            echo "Tag ${{ steps.version.outputs.version }} already exists; bump utils/app_metadata.py APP_VERSION"
            exit 1
          fi

  build:
    needs: version
    name: Build ${{ matrix.os }} (${{ matrix.machine }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ADBLab-win-x64
            archive_extension: zip
            python_architecture: x64
            machine: AMD64
            package_mode: --onedir
            windowed: --windowed
            icon: --icon icon.ico
            pip_cache: ~\AppData\Local\pip\Cache

          - os: macos-15-intel
            artifact: ADBLab-macos-x64
            archive_extension: zip
            python_architecture: x64
            machine: x86_64
            package_mode: --onefile
            windowed: --windowed
            icon: ""
            pip_cache: ~/Library/Caches/pip

          - os: macos-15
            artifact: ADBLab-macos-arm64
            archive_extension: zip
            python_architecture: arm64
            machine: arm64
            package_mode: --onefile
            windowed: --windowed
            icon: ""
            pip_cache: ~/Library/Caches/pip

          - os: ubuntu-latest
            artifact: ADBLab-linux-x64
            archive_extension: tar.gz
            python_architecture: x64
            machine: x86_64
            package_mode: --onefile
            windowed: ""
            icon: ""
            pip_cache: ~/.cache/pip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_architecture }}

      - name: Verify Python architecture
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          python - <<'PY'
          import os
          import platform

          actual = platform.machine()
          expected = os.environ["EXPECTED_MACHINE"]
          print(f"Python architecture: {actual}; expected: {expected}")
          if actual != expected:
              raise SystemExit(1)
          PY

      - name: Check source text integrity
        shell: bash
        run: python scripts/check_source_text.py

      - name: Cache pip
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ matrix.pip_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('requirements*.txt', 'constraints.txt') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Clean
        shell: bash
        run: rm -rf build dist || true

      - name: Install build dependencies
        shell: bash
        run: pip install -r requirements-build.txt

      - name: Install Linux Qt system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libudev1 libsm6 libice6 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 xvfb xauth

      - name: Verify Linux Qt plugin dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(python -c 'from pathlib import Path; from PySide6.QtCore import QLibraryInfo; print(Path(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath)) / "platforms" / "libqxcb.so")')"
          ldd "$plugin" | tee "$RUNNER_TEMP/qt-xcb-dependencies.txt"
          if grep -q 'not found' "$RUNNER_TEMP/qt-xcb-dependencies.txt"; then
            echo "Qt xcb plugin dependencies are incomplete."
            exit 1
          fi

      - name: Install static analysis dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        if: runner.os == 'Windows'
        shell: bash
        run: python -m ruff check .

      - name: Type check with pyright
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pyright

      - name: Prepare platform tools
        shell: bash
        run: python scripts/prepare_runtime_tools.py

      - name: Build scrcpy ADB bridge
        shell: bash
        run: python scripts/build_scrcpy_adb_bridge.py

      - name: Verify macOS helper architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          executable="build/runtime-helpers/adblab-adb-bridge/adblab-adb-bridge"
          file "$executable"
          test "$(lipo -archs "$executable")" = "${{ matrix.machine }}"

      - name: Source self-check
        if: runner.os != 'Windows'
        shell: bash
        run: python main.py --self-check packaging

      - name: Smoke test Linux source GUI
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          QT_DEBUG_PLUGINS: "1"
        run: timeout 15s xvfb-run -a python main.py --self-check gui

      - name: Build with PyInstaller
        shell: bash
        run: |
          python scripts/build_app.py \
            --name "${{ matrix.artifact }}-${{ needs.version.outputs.version }}" \
            ${{ matrix.package_mode }} ${{ matrix.windowed }} \
            ${{ matrix.icon }}

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          python scripts/check_build_artifacts.py frozen --executable "dist/$name/$name.exe" --timeout 60

      - name: Zip Windows onedir artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          Remove-Item -Recurse -Force "dist/$name"

      - name: Verify macOS app architecture and package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          executable="dist/$name.app/Contents/MacOS/$name"
          if [ ! -f "$executable" ]; then
            executable="dist/$name"
          fi
          file "$executable"
          test "$(lipo -archs "$executable")" = "${{ matrix.machine }}"
          python scripts/check_build_artifacts.py frozen --executable "$executable" --timeout 60

      - name: Zip macOS app artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          if [ -d "dist/$name.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/$name.app" "dist/$name.zip"
            rm -rf "dist/$name.app"
            rm -f "dist/$name"
          elif [ -f "dist/$name" ]; then
            (cd dist && zip -q "$name.zip" "$name")
            rm -f "dist/$name"
          else
            ls -la dist
            exit 1
          fi

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          python scripts/check_build_artifacts.py frozen --executable "dist/$name" --timeout 60

      - name: Smoke test Linux package GUI
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          QT_DEBUG_PLUGINS: "1"
        run: |
          name="${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          timeout 15s xvfb-run -a "dist/$name" --self-check gui

      - name: Archive Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}-${{ needs.version.outputs.version }}"
          chmod +x "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -f "dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}-${{ needs.version.outputs.version }}.${{ matrix.archive_extension }}
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release_artifacts

      - name: Create Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.version }}"
          TITLE="Release $TAG"
          NOTES_FILE=".github/release-notes/$TAG.md"

          python3 scripts/check_build_artifacts.py release --directory release_artifacts --version "$TAG"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release notes are missing or empty: $NOTES_FILE"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published versions are immutable."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; published versions are immutable."
            exit 1
          fi

          mapfile -d '' FILES < <(find release_artifacts -type f -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release artifacts found"
            exit 1
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Retain latest 5 version tags
        shell: bash
        run: |
          set -euo pipefail
          KEEP=5
          mapfile -t TAGS < <(git ls-remote --tags origin "refs/tags/v*" \
            | awk '{print $2}' | sed 's|refs/tags/||' | sort -V)
          if [ "${#TAGS[@]}" -le "$KEEP" ]; then
            echo "Version tags within retention limit (${#TAGS[@]} <= ${KEEP}); nothing to prune."
            exit 0
          fi
          DROP_COUNT=$((${#TAGS[@]} - KEEP))
          echo "Pruning ${DROP_COUNT} oldest version tags; keeping newest ${KEEP}."
          for TAG in "${TAGS[@]:0:${DROP_COUNT}}"; do
            echo "Removing old version tag and its release: $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            git push origin --delete "refs/tags/$TAG" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
