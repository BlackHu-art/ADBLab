name: Retention Audit

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Report retention candidates
    runs-on: ubuntu-latest

    steps:
      - name: Report workflow runs outside the retention window
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow runs after the newest 5 (audit only):"
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json databaseId,displayTitle,createdAt,status,url \
            --jq '.[5:]'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report releases outside the retention window
        shell: bash
        run: |
          set -euo pipefail
          echo "Releases after the newest 8 (audit only):"
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,name,createdAt,isImmutable \
            --jq '.[8:]'
        env:
          GH_TOKEN: ${{ github.token }}
