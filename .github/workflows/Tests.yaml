name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Check source text integrity
        run: python scripts/check_source_text.py

      - name: Cache pip
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'constraints.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type check with pyright
        run: python -m pyright

      - name: Check comment language
        run: python scripts/check_comment_language.py

      - name: Check documentation links
        run: python scripts/check_doc_links.py

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: python -m pytest -q
