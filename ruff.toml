# ADBLab lint 配置：行宽 100，语法目标 py310（与 README/CI 标准一致）。
line-length = 100
target-version = "py310"
exclude = [
    "mobileperf/extlib",
    "scrcpy-win64-v3.3.1",
    ".venv",
    "build",
    "dist",
]

[lint]
select = ["E", "F", "W", "UP", "I"]

# mobileperf 遗留子进程层的动态导入路径与 %-格式化：属结构性遗留，
# 在 Remote/MobilePerf 功能域重做（shell=True 与执行边界重构）时统一清理后再移除豁免。
[lint.per-file-ignores]
"mobileperf/**" = ["E402", "UP031"]
"tests/live_logcat_close_probe.py" = ["E402"]  # 探针脚本需先注入 sys.path 再导入
