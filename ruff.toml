# ADBLab lint 配置：行宽 100，语法目标 py310（与 README/CI 标准一致）。
line-length = 100
target-version = "py310"
exclude = [
    "mobileperf/extlib",
    "scrcpy-win64-v3.3.1",
    ".venv",
    "build",
    "dist",
]

[lint]
select = ["E", "F", "W", "UP", "I"]

# ADR-0003 Phase 1 已把 mobileperf 执行层改为参数数组 + psutil（core/process_utils），
# 一方源码不再有 E402/UP031 违规，`mobileperf/**` 豁免随之移除；extlib 仍走整体 exclude。
[lint.per-file-ignores]
"tests/live_logcat_close_probe.py" = ["E402"]  # 探针脚本需先注入 sys.path 再导入
