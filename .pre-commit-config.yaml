# ADBLab 提交前本地钩子（pre-commit）。所有钩子使用仓库内 `.venv` 的本地命令，
# 不依赖外部门禁服务；pre-commit 本体与钩子命令已在 .venv 安装。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/Scripts/python.exe -m ruff check .
        language: system
        pass_filenames: false
      - id: comment-language
        name: 中文注释门禁
        entry: .venv/Scripts/python.exe scripts/check_comment_language.py
        language: system
        pass_filenames: false
      - id: doc-links
        name: 文档链接与 frontmatter 校验
        entry: .venv/Scripts/python.exe scripts/check_doc_links.py
        language: system
        pass_filenames: false
